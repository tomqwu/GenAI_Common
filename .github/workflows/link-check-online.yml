name: link-check-online

on:
  schedule:
    - cron: '0 13 * * 0'   # 13:00 UTC every Sunday
  workflow_dispatch:

jobs:
  lychee-online:
    name: lychee (network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress '**/*.md'
          fail: true
