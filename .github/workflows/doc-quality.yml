name: doc-quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tier1-structural:
    name: Tier 1 — structural checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: File-length cap (200 lines)
        run: |
          violators=$(find . -name '*.md' -not -path './.git/*' -exec wc -l {} + \
                      | awk '$1 > 200 && $2 != "total"')
          if [ -n "$violators" ]; then
            printf 'Files over 200 lines:\n%s\n' "$violators"
            exit 1
          fi

      - name: Boundaries section presence
        run: |
          missing=""
          for f in AGENTS.md CLAUDE.md BOOTSTRAP.md \
                   .github/copilot-instructions.md \
                   .github/instructions/*.instructions.md \
                   docs/knowledge/*.md; do
            [ -e "$f" ] || continue
            grep -q '^## Boundaries' "$f" || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            printf 'Missing Boundaries section in:%s\n' "$missing"
            exit 1
          fi

  markdownlint:
    name: Tier 2 — markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '**/*.md'

  links:
    name: Tier 3 — link check (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --verbose --no-progress '**/*.md'
          fail: true

  typos:
    name: Tier 4 — typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master
